
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Oxanium',sans-serif;background:#0a0a14;color:#e0e0f0;}
:root{--y:#FFD700;--b:#00BFFF;--g:#39FF14;--r:#FF3A3A;--p:#9B59B6;--border:rgba(60,60,100,0.55);}
.card-title{font-size:11px;color:var(--y);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}
.cube-selector{display:flex;gap:8px;margin-bottom:10px;}
.cube-opt{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:rgba(18,18,36,.9);color:#aaa;transition:all .15s;font-family:'Oxanium',sans-serif;letter-spacing:1px;}
.cube-opt.selected{border-color:var(--y);color:var(--y);background:rgba(255,215,0,.08);}
#game-canvas{display:block;width:100%;height:130px;background:#080810;border:1px solid var(--border);border-radius:8px;cursor:pointer;}
.glass{background:rgba(12,12,26,.88);border:1px solid var(--border);border-radius:14px;padding:20px;backdrop-filter:blur(12px);}
.flex-b{display:flex;justify-content:space-between;align-items:center;}
</style>

<div class="glass" style="max-width:680px;margin:0 auto;">
  <div class="card-title">🎮 Minijuego — elige tu cubo</div>
  <div class="cube-selector">
    <div class="cube-opt selected" onclick="setSkin(0,this)">Clásico</div>
    <div class="cube-opt" onclick="setSkin(1,this)">Neón</div>
    <div class="cube-opt" onclick="setSkin(2,this)">Galaxia</div>
  </div>
  <canvas id="game-canvas" width="660" height="130"></canvas>
  <div class="flex-b" style="margin-top:8px;font-size:12px;color:#888;">
    <span>Puntos: <span id="sc" style="color:var(--y);font-family:'Share Tech Mono',monospace;">0</span></span>
    <span>Mejor: <span id="bsc" style="color:var(--g);font-family:'Share Tech Mono',monospace;">0</span></span>
    <span style="font-size:11px;">Click o Espacio para saltar</span>
  </div>
</div>

<script>
const SKINS=[
  {body:'#FFD700',stroke:'#cc8800',eye:'#000',inner:'rgba(0,0,0,0.18)'},
  {body:'#00BFFF',stroke:'#0077aa',eye:'#001a2a',inner:'rgba(255,255,255,0.12)'},
  {body:'#9B59B6',stroke:'#5b2c6f',eye:'#1a0024',inner:'rgba(255,255,255,0.1)'},
];
let skin=0;
function setSkin(i,el){skin=i;document.querySelectorAll('.cube-opt').forEach((e,j)=>e.classList.toggle('selected',j===i));}

const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;

const GROUND_Y = H - 14;   // donde pisa el cubo
const FLOOR_TOP = H - 14;  // tope visual del suelo

let cube,obstacles,particles,score,frame,speed,alive,started,animId,bestScore=0;

function init(){
  cube={x:60,y:GROUND_Y-32,vy:0,size:32,angle:0,onGround:true};
  obstacles=[];particles=[];score=0;frame=0;speed=3.2;alive=true;started=false;
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function jump(){
  if(!alive){init();return;}
  if(!started) started=true;
  if(cube.onGround){
    cube.vy=-10;cube.onGround=false;
    for(let i=0;i<6;i++) particles.push({x:cube.x+cube.size/2,y:GROUND_Y,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:14,color:'#FFD700'});
  }
}

canvas.addEventListener('click',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});

function spawnObs(){
  const W2=W;
  if(Math.random()<0.5){
    // Spike — base en el suelo
    const sw=20, sh=24;
    obstacles.push({type:'spike',x:W2+10,y:FLOOR_TOP-sh,w:sw,h:sh});
  } else {
    // Block — apoyado en el suelo
    const bh=28+Math.floor(Math.random()*18), bw=30;
    obstacles.push({type:'block',x:W2+10,y:FLOOR_TOP-bh,w:bw,h:bh});
  }
}

function tick(){
  if(!started||!alive) return;
  frame++;score++;
  speed=3.2+score/350;

  cube.vy+=0.55;
  cube.y+=cube.vy;
  if(cube.y+cube.size>=GROUND_Y){
    cube.y=GROUND_Y-cube.size;
    cube.vy=0;cube.onGround=true;
    cube.angle=0;
  } else {
    cube.onGround=false;
    cube.angle+=0.09;
  }

  const interval=Math.max(48,88-Math.floor(score/70));
  if(frame%interval===0) spawnObs();

  obstacles.forEach(o=>o.x-=speed);
  obstacles=obstacles.filter(o=>o.x>-60);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;});
  particles=particles.filter(p=>p.life>0);

  const pad=3;
  for(const o of obstacles){
    const cx=cube.x+pad, cy=cube.y+pad;
    const cw=cube.size-pad*2, ch=cube.size-pad*2;
    if(cx+cw>o.x+pad && cx<o.x+o.w-pad && cy+ch>o.y+pad && cy<o.y+o.h-pad){
      alive=false;
      if(score>bestScore){bestScore=score;document.getElementById('bsc').textContent=bestScore;}
      for(let i=0;i<14;i++) particles.push({x:cube.x+cube.size/2,y:cube.y+cube.size/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:22,color:'#FF3A3A'});
      break;
    }
  }
  document.getElementById('sc').textContent=score;
}

function drawCube(x,y,size,angle,a){
  const sk=SKINS[skin];
  ctx.save();
  ctx.translate(x+size/2,y+size/2);
  ctx.rotate(angle);
  const s=size;
  ctx.fillStyle=a?sk.body:'#555';
  ctx.beginPath();ctx.roundRect(-s/2,-s/2,s,s,5);ctx.fill();
  ctx.strokeStyle=a?sk.stroke:'#333';ctx.lineWidth=2.5;ctx.stroke();
  if(skin===2&&a){
    ctx.fillStyle='rgba(255,255,255,0.07)';
    for(let i=0;i<4;i++) ctx.fillRect(-s/2+i*9,-s/2,3,s);
  }
  ctx.fillStyle=sk.inner;
  ctx.beginPath();ctx.roundRect(-s*.28,-s*.28,s*.56,s*.56,2);ctx.fill();
  ctx.fillStyle=sk.eye;
  ctx.beginPath();ctx.arc(s*.13,-s*.08,s*.11,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,191,255,0.05)';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}

  ctx.fillStyle='#1c1c36';ctx.fillRect(0,FLOOR_TOP,W,H-FLOOR_TOP);
  ctx.fillStyle='#00BFFF';ctx.fillRect(0,FLOOR_TOP-1,W,1);

  obstacles.forEach(o=>{
    if(o.type==='spike'){
      ctx.fillStyle='#FF3A3A';
      ctx.beginPath();
      ctx.moveTo(o.x+o.w/2, o.y);
      ctx.lineTo(o.x+o.w, o.y+o.h);
      ctx.lineTo(o.x, o.y+o.h);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#aa0000';ctx.lineWidth=1.5;ctx.stroke();
    } else {
      ctx.fillStyle='#222255';
      ctx.strokeStyle='#00BFFF';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,3);ctx.fill();ctx.stroke();
    }
  });

  particles.forEach(p=>{
    ctx.globalAlpha=p.life/22;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  });ctx.globalAlpha=1;

  drawCube(cube.x,cube.y,cube.size,cube.onGround?0:cube.angle,alive);

  if(!started){
    ctx.fillStyle='rgba(255,215,0,0.7)';ctx.font='12px Oxanium,sans-serif';ctx.textAlign='center';
    ctx.fillText('Click o Espacio para saltar',W/2,22);
  }
  if(!alive){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FF3A3A';ctx.font='bold 15px Oxanium,sans-serif';ctx.textAlign='center';
    ctx.fillText('GAME OVER · Click para reiniciar',W/2,H/2+5);
  }
}

function loop(){tick();draw();animId=requestAnimationFrame(loop);}
init();
</script>
